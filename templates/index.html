{% extends "base.html" %}

{% block title %}Simple Equalizer{% endblock %}

{% block content %}
<section class="space-y-8">
    <div class="max-w-3xl">
        <p class="text-sm font-semibold uppercase tracking-normal text-teal-700">Audio correction workspace</p>
        <h1 class="mt-2 text-4xl font-semibold tracking-normal text-zinc-950 sm:text-5xl">Simple Equalizer</h1>
    </div>

    <div class="grid gap-4 md:grid-cols-3">
        <a href="/full" class="flex min-h-32 items-end rounded-lg border border-zinc-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-teal-300 hover:shadow-md">
            <h2 class="text-xl font-semibold text-zinc-950">Correction</h2>
        </a>
        <a href="/limited" class="flex min-h-32 items-end rounded-lg border border-zinc-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-teal-300 hover:shadow-md">
            <h2 class="text-xl font-semibold text-zinc-950">Limited Band</h2>
        </a>
        <a href="/white_noise" class="flex min-h-32 items-end rounded-lg border border-zinc-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-teal-300 hover:shadow-md">
            <h2 class="text-xl font-semibold text-zinc-950">White Noise</h2>
        </a>
    </div>
</section>
{% endblock %}
